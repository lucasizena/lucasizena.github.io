{% extends "base.html" %}

{% block title %}{{ term.name }} | {{ config.title }}{% endblock title %}

{% block content %}
  <h1>Posts tagged “{{ term.name }}”</h1>

  <ol class="archive-list">
    {% for post in term.pages %}
      {% include "partials/archive-entry.html" %}
    {% endfor %}
  </ol>
{% endblock content %}
